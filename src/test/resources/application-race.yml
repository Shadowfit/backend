# 실 MySQL 프로파일 — Testcontainers 가 띄운 mysql:8.0 을 가리킨다.
#
# 왜 H2(기본 테스트 프로파일)로는 안 되는가:
#   기본 테스트는 ddl-auto: create-drop 이라 Hibernate 가 엔티티에서 스키마를 만든다.
#   PoseData 의 @ManyToOne @JoinColumn(session_id) 가 FK 제약을 생성하므로,
#   H2 테스트 스키마에는 프로덕션(V1__baseline.sql)에 없는 FK 가 생긴다.
#   프로덕션은 파티셔닝 때문에 FK 를 뗐다(docs/decisions/pose-data-partition-fk-tradeoff.md).
#
#   그래서 orphan INSERT 가 H2 에서는 참조무결성 위반으로 터지고 MySQL 에서는 조용히 들어간다.
#   재현이 안 되는 게 아니라 결과가 반대로 나온다. "FK 가 없다"는 전제 위에 세워진 결함은
#   원리상 H2 로 검증할 수 없다. JSON_TABLE(주간 B층)·벤더 제약명(가입 경합)도 같은 종류다.
#
# 띄우는 법: 없다. com.shadowfit.support.MySqlContainerSupport 를 상속하면 컨테이너가 뜨고
#   @ServiceConnection 이 datasource url/username/password 를 넣는다 — 그래서 이 파일엔
#   datasource 가 없다. Docker 가 없으면 테스트는 «건너뜀» 으로 보고된다.
#
#   [이력] 2026-09-11 이전에는 3307 에 컨테이너를 손으로 띄우고 V*.sql 을 순서대로 부어 넣은 뒤
#   -Drace.mysql=true 로 열어야 했다. 그 절차는 한 번 낡아서(#342 — V1 만 적재하라고 적혀
#   있던 것) 테스트가 «있어도 안 도는» 상태가 됐고, CI 는 이 프로파일을 한 번도 돌린 적이 없었다.
#
# 도는 법:
#   ./gradlew :backend:test --tests '*PoseDataOrphanRaceTest'
spring:
  # Flyway 가 스키마를 만든다 — 운영과 같은 경로. 마이그레이션이 곧 테스트 픽스처라
  # 번호 중복(#653)·엔티티와 어긋난 컬럼이 컨텍스트 기동에서 바로 잡힌다.
  flyway:
    enabled: true

  jpa:
    hibernate:
      # validate: 엔티티 매핑을 Flyway 가 만든 스키마와 대조만 한다(만들거나 고치지 않음).
      # 기본 프로파일(create-drop)은 «엔티티 ≠ 마이그레이션» 이어도 초록불이 뜨는데,
      # 여기서는 그 틈이 «Missing column/table» 로 드러난다.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never
