# dev 프로파일 — 로컬 개발 편의. 이 파일에 있는 것은 «운영에서 켜지면 안 되는 것» 들이다.
#
# 켜는 법: docker-compose.yml 이 SPRING_PROFILES_ACTIVE: dev 로 띄운다.
#          로컬 직접 실행은 ./gradlew bootRun --args='--spring.profiles.active=dev'
# 규약(application.yml 머리말): 프로파일 없는 기본값은 안전한 쪽이고, 편의는 여기서만 켠다.
# 그래서 아래 값들은 env var 로 열지 않는다 — 열려면 이 프로파일로 뜨면 된다.

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.shadowfit: DEBUG
    net.devh: DEBUG
