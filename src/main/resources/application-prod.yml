# prod 프로파일 — 프록시 뒤에서 살기 위한 자리
#
# 이 파일이 왜 생겼나 (docs/decisions/reverse-proxy-and-tls.md §8-2)
# ---------------------------------------------------------------------------
# application.yml 이 `spring.profiles.active: prod` 를 기본값으로 들고 있는데 정작
# application-prod.yml 이 **없었다**. 즉 "prod 로 돈다"고 적혀 있으면서 prod 전용 설정을
# 넣을 자리가 하나도 없는 상태였다(§1-4). 리버스 프록시를 어느 쪽으로 고르든
# (nginx/Caddy/ALB/CF Tunnel) 백엔드가 할 일은 인증서가 아니라 여기 있는 것들이다.
#
# 2026-09-11 부터 이 파일은 **운영에서만** 읽힌다 — docker-compose.prod.yml 만 SPRING_PROFILES_ACTIVE: prod 를
# 준다(개발 compose 는 dev, 로컬 bootRun 은 프로파일 없음 또는 dev). 예전엔 개발 compose 도 prod 로 떠서
# 여기 적는 값이 개발에도 적용됐고, 그래서 «운영에서 켜야 하는 것» 을 켠 채로 둘 수 없었다.
# 그 제약은 풀렸지만 아래 forward-headers 는 여전히 env var + 안전 기본값이다 — 그건 dev/prod 문제가 아니라
# «앞에 프록시가 실제로 있는가» 의 문제라서(아래 주석).

server:
  # 프록시가 앞에 설 때 X-Forwarded-* 를 믿을지.
  #
  # 🔴 **기본값이 none 인 것은 게으름이 아니라 안전 쪽 선택이다.** 이 값을 framework 로 켜면
  #    Spring 은 요청이 들고 온 X-Forwarded-Proto·X-Forwarded-For 를 **그대로 믿는다.**
  #    앞에 프록시가 없거나, 있어도 그 프록시가 이 헤더를 덮어쓰지 않으면 **아무나 자기
  #    클라이언트 IP 와 스킴을 위조**할 수 있다 — 지금 이 저장소가 정확히 그 상태다
  #    (프록시 없음, 8080 직결. reverse-proxy-and-tls.md §8-3 선행 조건 참조).
  #
  # ✅ **framework 로 켜야 할 때**: 프록시를 실제로 앞에 세웠고, 그 프록시가 X-Forwarded-*
  #    를 **자기가 덮어쓰도록** 설정돼 있을 때. 그때 배포 환경에서 이 환경변수만 바꾼다.
  #
  # 켜면 무엇이 고쳐지나: 프록시가 TLS 를 종료하면 백엔드에는 http 로 들어오므로, 이 설정이
  # 없으면 ① 리다이렉트·절대 URL 이 http 로 생성되고 ② 접근 로그의 클라이언트 IP 가 전부
  # 프록시 IP 하나로 찍힌다. 둘 다 «돌긴 도는데 조용히 틀린» 부류다.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
